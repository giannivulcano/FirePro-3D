<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="40mm" height="40mm" viewBox="0 0 40 40" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Two-token (icon-style-guide): #1a1a1a -> ink (primary), #004cff -> accent.
       A multi-segment path distinguishes the polyline from the single-segment
       line icon; hollow accent vertex markers match the 2D-geo icon family. -->
  <path d="M 7,29 L 15,13 L 25,26 L 33,10"
        style="fill:none;stroke:#1a1a1a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/>
  <circle cx="7"  cy="29" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
  <circle cx="15" cy="13" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
  <circle cx="25" cy="26" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
  <circle cx="33" cy="10" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
</svg>
