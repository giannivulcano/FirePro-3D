  <rect x="6" y="6" width="28" height="28" style="fill:none;stroke:#004cff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/>
  <circle cx="6" cy="6" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
  <circle cx="34" cy="6" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
  <circle cx="6" cy="34" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
  <circle cx="34" cy="34" r="1.8" style="fill:#ffffff;stroke:#004cff;stroke-width:1.6"/>
</svg>
