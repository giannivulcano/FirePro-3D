[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# A hung test (e.g. an unpatched modal dialog) used to stall the whole suite
# silently — no output, no full run for days. Cap every test so a hang becomes
# a normal red timeout with a traceback instead. Generous enough that no
# legitimate test trips it. Windows has no SIGALRM, so use the thread method.
timeout = 300
timeout_method = thread

# Wall-clock timing guards are load-sensitive: run them in their own process,
# never inside a busy full-suite chunk (docs/specs/test-harness.md Invariant 8).
markers =
    perf: wall-clock timing guard; run standalone with -m perf, exclude from full-suite chunks with -m "not perf"
